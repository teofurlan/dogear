[project]
name = "dogear"
version = "0.1.0"
description = "Turns photos of highlighted book pages into reviewed quotes."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.2",
    "opencv-python-headless>=4.11",
    "pytesseract>=0.3.13",
]

[project.scripts]
dogear-extract = "dogear.entrypoints.extract_cli:main"

[project.optional-dependencies]
observability = [
    "sentry-sdk>=2.72,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dogear"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "photos: needs the local-only photos in tests/fixtures/private (skipped when absent)",
    "tesseract: needs the Tesseract binary with Spanish data",
]
