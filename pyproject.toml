[project]
name = "dogear"
version = "0.1.0"
description = "Turns photos of highlighted book pages into reviewed quotes."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.156.8",
    "numpy>=2.2",
    "opencv-python-headless>=4.11",
    "pillow>=13,<14",
    "pyjwt[crypto]>=2.15.1,<3",
    "pymongo>=4.16,<5",
    "pytesseract>=0.3.13",
    "uvicorn>=0.54.0",
]

[project.scripts]
dogear-extract = "dogear.entrypoints.extract_cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dogear"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "photos: needs the local-only photos in tests/fixtures/private (skipped when absent)",
    "tesseract: needs the Tesseract binary with Spanish data",
]
