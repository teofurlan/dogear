name: Bug report
description: Report something in Dogear that is broken or behaves unexpectedly.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please check that an open issue does not already cover it.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear, short description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest sequence of steps that triggers the bug.
      placeholder: |
        1. Open Dogear
        2. ...
        3. See the error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Select every area that seems involved.
      multiple: true
      options:
        - Web app / PWA / Library UI
        - Book entry / Camera & photos
        - Extraction pipeline / CLI
        - Nightly processing / Render cron
        - API / FastAPI / Backend
        - Auth0 / Authentication
        - MongoDB / Persistence
        - R2 / Storage
        - Other
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 23H2 / iOS 18 / Android 15
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 130 / Safari 18
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Dogear version or commit
      description: Output of `git rev-parse --short HEAD`, if you run from source.
      placeholder: 1302d49

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output from server or browser console. It is formatted as code automatically.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, recordings, or anything else that helps.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed API keys, tokens, and private paths or code from the logs and screenshots above.
          required: true
