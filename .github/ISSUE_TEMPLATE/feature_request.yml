name: Feature request
description: Propose a new capability or a change to how Dogear behaves.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please check that an open or closed issue does not already cover it.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences on what the feature does.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: The problem it solves and who runs into it today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it could work. Tools, protocol messages, or UI behavior if you have them in mind.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable outcomes that mean the feature is done.
      placeholder: |
        - [ ] ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Select every area that seems involved.
      multiple: true
      options:
        - Web app / PWA / Library UI
        - Book entry / Camera & photos
        - Extraction pipeline / CLI
        - Nightly processing / Render cron
        - API / FastAPI / Backend
        - Auth0 / Authentication
        - MongoDB / Persistence
        - R2 / Storage
        - Other

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: What this feature deliberately does not cover.

  - type: textarea
    id: related
    attributes:
      label: Dependencies and related issues
      description: Issues this depends on or relates to, for example `Depends on #12`.

  - type: textarea
    id: questions
    attributes:
      label: Open questions
      description: Decisions that are still open.
