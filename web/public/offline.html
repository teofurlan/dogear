<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e9e9e5">
  <title>Offline — Dogear</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background-color: #e9e9e5;
      color: #191919;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .offline-card {
      background: #e9e9e5;
      border: 1px solid #191919;
      max-width: 440px;
      width: 100%;
      padding: 2rem 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .wordmark {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.04em;
      text-decoration: none;
      color: #191919;
    }
    .wordmark span {
      color: #c8302d;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #191919;
    }
    .offline-note {
      font-size: 0.85rem;
      color: #555555;
      border-top: 1px solid #ccc;
      padding-top: 0.75rem;
    }
    button {
      background: #c8302d;
      color: #ffffff;
      border: 1px solid #191919;
      padding: 0.75rem 1.25rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      align-self: flex-start;
      margin-top: 0.5rem;
    }
    button:hover {
      background: #a8201d;
    }
  </style>
</head>
<body>
  <main class="offline-card" role="main">
    <div class="wordmark" aria-label="Dogear">dogear<span>.</span></div>
    <h1>You are currently offline</h1>
    <p>Dogear requires an internet connection to sync your library, verify your session, and save new books.</p>
    <p class="offline-note">Offline book entry and photo quote capture are not implemented in this version.</p>
    <button type="button" onclick="window.location.reload()">Try reconnecting</button>
  </main>
</body>
</html>
